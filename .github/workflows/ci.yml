name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify zero runtime dependencies
        run: node -e "const pkg = JSON.parse(require('fs').readFileSync('./package.json', 'utf8')); if (Object.keys(pkg.dependencies || {}).length > 0) { console.error('Dependencies must be empty'); process.exit(1); }"

      - name: Run unit tests
        run: node --test test/*.test.js
